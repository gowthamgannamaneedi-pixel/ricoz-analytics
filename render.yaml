services:
  - type: web
    name: ricoz-analytics
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CLIENT_URL
        value: https://ricoz-analytics.vercel.app
      - key: CORS_ORIGIN
        value: https://ricoz-analytics.vercel.app
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        value: http://localhost:8000

  - type: web
    name: ricoz-analytics-ai-service
    runtime: python
    buildCommand: pip install -r ai-service/requirements.txt
    startCommand: uvicorn app.main:app --app-dir ai-service --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_SERVICE_SECRET
        value: ricoz_ai_service_secure_key_production_2026
